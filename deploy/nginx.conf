# nginx 反向代理（HTTP）。HTTPS 见 deploy/nginx.https.conf，按 DEPLOY.md 第 5 步切换。
#
# 两处非改不可的地方：
#   - /api/chat 必须 proxy_buffering off，否则 SSE 会被 nginx 攒成一整块再发，
#     「流式」名存实亡，手机上一等就是十几秒。
#   - client_max_body_size 要和 .env 的 MAX_UPLOAD_MB 对齐，否则 413 由 nginx 先返回，
#     后端根本没收到请求，前端只能看到一个没有原因的失败。

upstream kb_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # certbot webroot 校验（换成 HTTPS 后仍然需要，续期要用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 问答流：唯一允许长时间挂着的接口
    location /api/chat {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传：解析在后台跑，请求本身很快；超时给 120s 足够传 50MB
    location /api/ {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /static/ {
        proxy_pass http://kb_app;
        proxy_set_header Host $host;
        expires 1h;
    }

    location / {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
